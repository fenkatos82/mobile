name: Build Lichess Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Code Generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate Temporary Signing Keystore
        run: |
          keytool -genkey -v -keystore android/upload-keystore.jks -storepass 123456 -alias upload -keypass 123456 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Test,O=Test,C=US"
          cat <<EOF > android/key.properties
          storePassword=123456
          keyPassword=123456
          keyAlias=upload
          storeFile=../upload-keystore.jks
          EOF

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lichess-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
